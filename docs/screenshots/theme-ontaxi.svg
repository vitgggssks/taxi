<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="560" fill="#F6F7F9"/>

  <text x="32" y="44" font-size="20" font-weight="800" fill="#14171A">РУХ — палітра в тонах OnTaxi</text>
  <text x="32" y="66" font-size="12" fill="#66707A">жовтий #FFD000 · чорний #14171A · білі картки на світло-сірому фоні</text>

  <!-- палітра -->
  <g transform="translate(32, 88)">
    <g>
      <rect width="120" height="72" rx="12" fill="#FFD000"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">accent</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#FFD000 (бренд OnTaxi)</text>
    </g>
    <g transform="translate(132,0)">
      <rect width="120" height="72" rx="12" fill="#FFF4C2"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">accent soft</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#FFF4C2</text>
    </g>
    <g transform="translate(264,0)">
      <rect width="120" height="72" rx="12" fill="#14171A"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">ink</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#14171A</text>
    </g>
    <g transform="translate(396,0)">
      <rect width="120" height="72" rx="12" fill="#FFFFFF" stroke="#DADEE3"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">surface</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#FFFFFF</text>
    </g>
    <g transform="translate(528,0)">
      <rect width="120" height="72" rx="12" fill="#F1F3F5"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">surface alt</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#F1F3F5</text>
    </g>
    <g transform="translate(660,0)">
      <rect width="120" height="72" rx="12" fill="#0B7A48"/>
      <text x="10" y="92" font-size="11" font-weight="700" fill="#14171A">success</text>
      <text x="10" y="106" font-size="10" fill="#66707A">#0B7A48</text>
    </g>
  </g>

  <!-- макет екрана -->
  <g transform="translate(32, 220)">
    <rect width="380" height="312" rx="26" fill="#FFFFFF" stroke="#E3E6EA"/>
    <!-- смуга статусу -->
    <rect x="0" y="0" width="380" height="44" rx="26" fill="#F6F7F9"/>
    <rect x="0" y="30" width="380" height="14" fill="#F6F7F9"/>
    <rect x="16" y="14" width="26" height="26" rx="8" fill="#FFD000"/>
    <text x="26" y="33" font-size="15" font-weight="800" fill="#14171A">Р</text>
    <text x="52" y="32" font-size="14" font-weight="700" fill="#14171A">Куди їдемо?</text>
    <text x="330" y="32" font-size="11" fill="#66707A">Київ</text>

    <!-- картка з адресами -->
    <rect x="16" y="56" width="348" height="96" rx="16" fill="#FFFFFF" stroke="#E3E6EA"/>
    <circle cx="34" cy="82" r="5" fill="#12B76A"/>
    <text x="48" y="86" font-size="12" fill="#14171A">Хрещатик, 1</text>
    <circle cx="34" cy="112" r="5" fill="#9B51E0"/>
    <text x="48" y="116" font-size="12" fill="#14171A">ТРЦ Gulliver</text>
    <rect x="28" y="132" width="324" height="1" fill="#EDEFF2"/>

    <!-- класи -->
    <g>
      <rect x="16" y="160" width="168" height="52" rx="14" fill="#FFD000"/>
      <text x="30" y="181" font-size="12" font-weight="700" fill="#14171A">Економ</text>
      <text x="30" y="198" font-size="11" fill="#14171A">86.09 ₴ · 4 хв</text>
      <rect x="212" y="160" width="152" height="52" rx="14" fill="#F1F3F5"/>
      <text x="226" y="181" font-size="12" font-weight="700" fill="#14171A">Комфорт</text>
      <text x="226" y="198" font-size="11" fill="#66707A">142.61 ₴</text>
    </g>

    <!-- статус -->
    <rect x="16" y="222" width="90" height="24" rx="8" fill="#0B7A48" opacity="0.12"/>
    <text x="26" y="238" font-size="11" font-weight="700" fill="#0B7A48">Завершено</text>

    <!-- кнопка -->
    <rect x="16" y="258" width="348" height="40" rx="14" fill="#FFD000"/>
    <text x="150" y="283" font-size="13" font-weight="700" fill="#14171A">Замовити · 86.09 ₴</text>
  </g>

  <!-- макет входу -->
  <g transform="translate(452, 220)">
    <rect width="380" height="312" rx="26" fill="#FFFFFF" stroke="#E3E6EA"/>
    <text x="24" y="40" font-size="15" font-weight="800" fill="#14171A">Вхід у РУХ</text>
    <text x="24" y="60" font-size="11" fill="#66707A">демо-доступ</text>

    <!-- банер сервера -->
    <rect x="24" y="76" width="332" height="44" rx="12" fill="#0B7A48" opacity="0.08"/>
    <circle cx="42" cy="98" r="6" fill="#0B7A48"/>
    <text x="56" y="95" font-size="11" font-weight="700" fill="#0B7A48">Сервер на звʼязку</text>
    <text x="56" y="110" font-size="10" fill="#66707A">rukh-api · 3 адреси</text>

    <!-- поле телефону -->
    <rect x="24" y="132" width="332" height="46" rx="14" fill="#F1F3F5"/>
    <text x="40" y="160" font-size="13" fill="#14171A">+380 67 111 22 33</text>

    <!-- CTA -->
    <rect x="24" y="190" width="332" height="46" rx="14" fill="#FFD000"/>
    <text x="88" y="218" font-size="13" font-weight="700" fill="#14171A">Демо-вхід одним дотиком</text>

    <!-- чипи ролей -->
    <g>
      <rect x="24" y="250" width="92" height="30" rx="10" fill="#FFFFFF" stroke="#DADEE3"/>
      <text x="40" y="269" font-size="11" fill="#14171A">Пасажир</text>
      <rect x="124" y="250" width="86" height="30" rx="10" fill="#FFFFFF" stroke="#DADEE3"/>
      <text x="140" y="269" font-size="11" fill="#14171A">Водій</text>
      <rect x="218" y="250" width="130" height="30" rx="10" fill="#FFFFFF" stroke="#DADEE3"/>
      <text x="234" y="269" font-size="11" fill="#14171A">Диспетчер</text>
    </g>
  </g>
</svg>
