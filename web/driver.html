<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <title>РУХ Водій</title>
  <link rel="stylesheet" href="/app/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232ee6a8'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230b0e13'>В</text></svg>" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone" id="app">
      <div class="phone-head">
        <div class="row" style="gap:8px">
          <div class="brand-mark" style="width:28px;height:28px;border-radius:9px;font-size:13px;background:linear-gradient(135deg,#2ee6a8,#7c5cff)">В</div>
          <div>
            <div class="brand-name" style="font-size:13px">РУХ · ВОДІЙ</div>
            <div class="brand-sub" id="statusLabel">офлайн</div>
          </div>
        </div>
        <div class="row" style="gap:6px">
          <a class="btn sm ghost" href="/">Пасажир</a>
          <a class="btn sm ghost" href="/admin">Адмін</a>
          <button class="btn sm ghost" id="logoutBtn">⎋</button>
        </div>
      </div>
      <div class="phone-body" id="screen"></div>
      <div class="phone-foot hide" id="footer"></div>
      <div class="tabbar" id="tabbar"></div>
    </div>
  </div>
  <script type="module" src="/app/driver.js"></script>
</body>
</html>
